name: Observe JetBlue routes

# Records which JetBlue routes are flying, from the site's own live list (/api/live), until OBSERVE_UNTIL.
# GitHub's 15-minute schedule did not fire for this repo, so each run instead takes a snapshot every
# 5 minutes for about 55 minutes and then starts the next run itself (workflow_dispatch is allowed from
# GITHUB_TOKEN). The running list lives in the Actions cache; it is committed at most every 6 hours (so
# routes can be mapped while it runs, with few redeploys) and once more when the window ends.
# Every commit starts "Map new routes" (map-routes.yml), which maps what qualifies and publishes it.
# Start it, or restart a broken chain, from the Actions tab with "Run workflow". Tick "commit" to commit the
# latest saved list right away (a separate queue: the chain keeps running).
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the observations now"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # "Commit now" runs have their own queue, so they don't wait behind (or replace) the chain.
  group: observe-routes-${{ inputs.commit && 'commit' || 'chain' }}
  cancel-in-progress: false

env:
  OBSERVE_UNTIL: "2026-11-15T01:00:00Z"   # Sat 14 Nov, 20:00 New York (second and last window, started at 08:00)
  COMMIT_EVERY_H: "6"

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Observing, finishing or done?
        id: phase
        run: |
          now=$(date -u +%s); until=$(date -u -d "$OBSERVE_UNTIL" +%s)
          if [ "$now" -lt "$until" ]; then phase=observe
          elif [ "$now" -le $((until + 7200)) ]; then phase=finish
          else phase=done; fi
          # "Commit now": no snapshots this run, commit straight away, then the chain carries on.
          if [ "${{ inputs.commit }}" = "true" ] && [ "$phase" = "observe" ]; then phase=commit; fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Phase: $phase"

      - uses: actions/checkout@v7
        if: steps.phase.outputs.phase != 'done'
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v7
        if: steps.phase.outputs.phase != 'done'
        with:
          python-version: "3.13"

      - name: Restore the list so far
        if: steps.phase.outputs.phase != 'done'
        uses: actions/cache/restore@v5
        with:
          path: pipeline/observed_routes.json
          key: observed-routes-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: observed-routes-

      - name: A snapshot every 5 minutes for up to 55 minutes
        if: steps.phase.outputs.phase == 'observe'
        run: |
          end=$(( $(date -u +%s) + 3300 )); until=$(date -u -d "$OBSERVE_UNTIL" +%s)
          [ "$until" -lt "$end" ] && end=$until
          while :; do
            python pipeline/observe_routes.py || echo "Snapshot failed, trying again in 5 minutes."
            [ $(( $(date -u +%s) + 300 )) -gt "$end" ] && break
            sleep 300
          done

      - name: Combine with the copy in the repo (nothing is lost if both changed)
        if: always() && steps.phase.outputs.phase != 'done'
        run: |
          git show HEAD:pipeline/observed_routes.json > "$RUNNER_TEMP/repo.json" 2>/dev/null || true
          python pipeline/observe_routes.py --merge "$RUNNER_TEMP/repo.json"

      - name: Keep the list for the next run
        if: always() && steps.phase.outputs.phase == 'observe'
        uses: actions/cache/save@v5
        with:
          path: pipeline/observed_routes.json
          key: observed-routes-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the list
        if: always() && steps.phase.outputs.phase != 'done'
        uses: actions/upload-artifact@v7
        with:
          name: observed-routes
          path: pipeline/observed_routes.json
          if-no-files-found: ignore
          overwrite: true

      - name: Commit (every 6 hours, when asked, and when the window ends), then start the route mapper
        if: steps.phase.outputs.phase != 'done'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f pipeline/observed_routes.json ] || { echo "Nothing observed yet."; exit 0; }
          last=$(git log -1 --format=%ct -- pipeline/observed_routes.json 2>/dev/null || echo 0); last=${last:-0}
          age=$(( $(date -u +%s) - last ))
          if [ "${{ steps.phase.outputs.phase }}" = "observe" ] \
             && [ "$age" -lt $(( COMMIT_EVERY_H * 3600 )) ]; then
            echo "Last commit $((age / 60)) minutes ago; not yet."; exit 0
          fi
          git config user.name "a-to-f-bot"
          git config user.email "a-to-f-bot@users.noreply.github.com"
          git add pipeline/observed_routes.json
          git diff --cached --quiet && { echo "No change since the last commit."; exit 0; }
          git commit -m "Observed JetBlue routes ($(python3 -c 'import json;d=json.load(open("pipeline/observed_routes.json"));r=d["routes"].values();print(len(d["routes"]),"pairs,",sum(1 for x in r if x.get("confirmed")),"confirmed,",d["snapshots"],"snapshots")'))"
          git pull --rebase -q origin main
          git push
          gh workflow run map-routes.yml --ref main -R "$GITHUB_REPOSITORY"

      - name: Start the next run
        if: always() && steps.phase.outputs.phase == 'observe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run observe-routes.yml --ref main -R "$GITHUB_REPOSITORY"
