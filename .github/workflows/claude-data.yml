name: Generate Claude data

# Run by hand from the Actions tab. Uses the repo secret ANTHROPIC_API_KEY and commits the results,
# which redeploys the site. Narration uses the Message Batches API (half price), and every line is
# checked against the geometry before it is committed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r pipeline/requirements.txt
      - name: Narration lines and trade-off tips
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: pipeline
        run: |
          python narrate.py
          python check_claims.py --strict
      - name: Commit results
        run: |
          git config user.name "a-to-f-bot"
          git config user.email "a-to-f-bot@users.noreply.github.com"
          git add web/public/data/narration.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update Claude narration"
          git push
