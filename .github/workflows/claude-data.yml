name: Generate Claude data

# Run by hand from the Actions tab. Uses the repo secret ANTHROPIC_API_KEY and commits the results,
# which redeploys the site. Both jobs use the Message Batches API (half price).
on:
  workflow_dispatch:
    inputs:
      job:
        description: "What to generate"
        type: choice
        options: [evaluate, narrate, both]
        default: both

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r pipeline/requirements.txt
      - name: Evaluation (Claude alone vs Claude + engine)
        if: ${{ inputs.job != 'narrate' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: pipeline
        run: python evaluate.py
      - name: Narration lines and trade-off tips
        if: ${{ inputs.job != 'evaluate' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: pipeline
        run: |
          python narrate.py
          python check_claims.py --strict
      - name: Commit results
        run: |
          git config user.name "a-to-f-bot"
          git config user.email "a-to-f-bot@users.noreply.github.com"
          git add web/public/data/evaluation.json web/public/data/narration.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update Claude-generated data (${{ inputs.job }})"
          git push
